{% extends 'base/base.html' %}

{% block title %}No Account Found - Banking System{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header bg-warning">
                <h4 class="mb-0"><i class="fas fa-exclamation-triangle me-2"></i>No Account Found</h4>
            </div>
            <div class="card-body text-center">
                <i class="fas fa-user-slash fa-5x mb-4 text-muted"></i>
                <h3>You don't have a bank account yet</h3>
                <p class="lead">Please contact an administrator to create an account for you.</p>
                
                <hr>
                
                <a href="{% url 'logout' %}" class="btn btn-outline-primary mt-3">
                    <i class="fas fa-sign-out-alt me-2"></i>Logout
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
